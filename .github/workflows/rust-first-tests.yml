name: rust-first-policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-first-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Rust formatting
        run: cargo fmt --manifest-path tools/rust-first-policy/Cargo.toml --all -- --check
      - name: Run Rust policy tests
        run: cargo test --manifest-path tools/rust-first-policy/Cargo.toml --all-targets
      - name: Rust clippy
        run: cargo clippy --manifest-path tools/rust-first-policy/Cargo.toml --all-targets -- -D warnings
      - name: Fail closed on new Python automation
        run: cargo run --quiet --manifest-path tools/rust-first-policy/Cargo.toml -- .
