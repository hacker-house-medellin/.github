name: Validate hhm-e2e seed

on:
  pull_request:
    paths:
      - repository-seeds/hhm-e2e/**
      - .github/workflows/validate-hhm-e2e-seed.yml
  push:
    branches: [main]
    paths:
      - repository-seeds/hhm-e2e/**
      - .github/workflows/validate-hhm-e2e-seed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
      - name: Require resolver-owned locks
        run: |
          test ! -e repository-seeds/hhm-e2e/.zpkg.lock
          test ! -e repository-seeds/hhm-e2e/.gitmodules
          test ! -e repository-seeds/hhm-e2e/package-lock.json
          test ! -e repository-seeds/hhm-e2e/rust-smoke/Cargo.lock
      - name: Resolve exact npm graph without lifecycle scripts
        run: |
          npm --prefix repository-seeds/hhm-e2e install \
            --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix repository-seeds/hhm-e2e ci \
            --ignore-scripts --no-audit --no-fund
      - name: Validate browser and offline contracts
        working-directory: repository-seeds/hhm-e2e
        run: |
          node scripts/validate-structure.mjs
          node --test tests/contracts/*.test.mjs
          find . -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          bash -n publish.sh
      - name: Resolve and validate Rust smoke runner
        working-directory: repository-seeds/hhm-e2e
        run: |
          rustup component add rustfmt clippy
          cargo generate-lockfile --manifest-path rust-smoke/Cargo.toml
          cargo fmt --manifest-path rust-smoke/Cargo.toml --all -- --check
          cargo check --manifest-path rust-smoke/Cargo.toml --locked --all-targets
          cargo clippy --manifest-path rust-smoke/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path rust-smoke/Cargo.toml --locked
      - name: Reject credential-shaped tracked values
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.vendor \
            '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|cfat_[A-Za-z0-9_-]{20,}|sk-(svcacct|ant-api|proj)-[A-Za-z0-9_-]{16,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            repository-seeds/hhm-e2e; then
            echo 'credential-shaped value found in seed' >&2
            exit 1
          fi
